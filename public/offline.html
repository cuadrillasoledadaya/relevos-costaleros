<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Relevos de costaleros</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f2f7;
        --surface: #ffffff;
        --fg: #1f1b24;
        --fg-muted: #55505e;
        --primary: #5b2c87;
        --primary-fg: #ffffff;
        --border: #e2dee9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121016;
          --surface: #1c1922;
          --fg: #f1eef6;
          --fg-muted: #bdb7c8;
          --primary: #c9a9f2;
          --primary-fg: #241231;
          --border: #302c38;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--fg-muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        Esta pantalla necesita conexión para mostrar los datos de la cuadrilla y el plan de relevos.
        Vuelve a intentarlo en cuanto recuperes la cobertura: la app se abre sola cuando hay red.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
